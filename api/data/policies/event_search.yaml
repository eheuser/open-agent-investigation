title: Event Search & Analysis
description: Search through event data to find specific patterns or answer questions

rules:
  effort:
    type: string
    description: Analysis effort level (low=6 loops, medium=12 loops, high=18 loops)
    default: medium

investigation_plan_tips: |
  This policy uses the EventAgent to search through all event data.
  The agent queries the unified events table with these capabilities:
  - Search by event_type field (with wildcards like "evtx_*", "registry_*")
  - Search by event_ts field (time range queries for temporal analysis)
  - Search payload JSONB field (case-insensitive content search for IOCs)
  - Count events matching criteria (understand data volume before fetching)
  - Paginate results (default limit: 10, max: 50, use offset for more)
  - Build a knowledge graph of related events with tags and relationships

evidence_registration: |
  The agent will register findings as knowledge graph nodes and edges:
  - Important events become nodes
  - Relationships between events become edges
  - Tags applied to highlight suspicious or relevant items

seed_instructions: |
  You are an expert event analyst. Search through the investigation's event data to answer this question:
  
  Question: {question}
  
  Effort Level: {effort}
  
  ## Available Event Types
  
  The investigation contains parsed forensic artifacts with the following event types:
  
  **Windows Event Logs (EVTX)**:
  - `evtx_<channel>_<event_id>` - Windows event log entries (e.g., evtx_security_4624 for logon events)
  - Common Event IDs:
    - 4624: Successful logon
    - 4625: Failed logon
    - 4672: Special privileges assigned
    - 4688: New process created
    - 4689: Process exited
    - 4720: User account created
    - 4732: User added to security group
    - 5140: Network share accessed
    - 7045: Service installed
  
  **Registry Data**:
  - `registry_value` - Registry key/value pairs
  - `registry_<plugin_name>` - Output from registry analysis plugins
  
  **File System Artifacts**:
  - `mft_entry` - Master File Table entries (file metadata)
  - `prefetch_execution` - Prefetch file data (program execution)
  - `lnk_file` - Windows shortcut file data
  
  ## Database Schema & Query Parameters
  
  Events are stored with these database fields:
  - **event_id**: Integer (primary key)
  - **event_ts**: Timestamp (when the event occurred - use for timerange queries)
  - **event_type**: String (e.g., "evtx_security_4624", "mft_entry") - use for type searches
  - **artifact_id**: Integer (source file reference)
  - **payload**: JSONB (structured data) - use for content searches
  
  ## Event Payload Structures by Type
  
  ### EVTX (Windows Event Logs)
  Event Type: `evtx_<channel>_<event_id>` (e.g., evtx_security_4624, evtx_security_4688)
  ```json
  {{
    "event_id": 4624,
    "timestamp": "2023-03-24T12:38:23Z",
    "system": {{"Computer": "WORKSTATION01", "Channel": "Security"}},
    "event_data": {{"SubjectUserName": "SYSTEM", "TargetUserName": "Admin", "IpAddress": "192.168.1.100"}},
    "user_data": {{}},
    "record_id": 123456
  }}
  ```
  **Search by content for**: usernames, IPs, computer names, logon types
  
  ### Registry
  Event Type: `registry_value` or `registry_<plugin_name>`
  ```json
  {{
    "key_path": "HKLM\\Software\\Microsoft\\Windows\\CurrentVersion\\Run",
    "value_name": "Startup Program",
    "value_data": "C:\\malware.exe",
    "value_type": "REG_SZ"
  }}
  ```
  **Search by content for**: registry keys, value names, persistence locations
  
  ### MFT (Master File Table)
  Event Type: `mft_entry`
  ```json
  {{
    "filename": "suspicious.exe",
    "parent_path": "C:\\Users\\Admin\\Downloads",
    "created": "2023-03-24T08:30:00Z",
    "modified": "2023-03-24T08:35:00Z",
    "size": 524288
  }}
  ```
  **Search by content for**: filenames, paths, extensions
  
  ### Prefetch
  Event Type: `prefetch_execution`
  ```json
  {{
    "executable": "C:\\Windows\\System32\\cmd.exe",
    "run_count": 42,
    "last_run_time": "2023-03-24T14:20:00Z",
    "files_accessed": ["C:\\Users\\Admin\\Documents\\data.txt"]
  }}
  ```
  **Search by content for**: executable names, accessed files
  
  ### LNK (Shortcuts)
  Event Type: `lnk_file`
  ```json
  {{
    "target_path": "C:\\malware\\payload.exe",
    "arguments": "-silent -install",
    "working_directory": "C:\\malware"
  }}
  ```
  **Search by content for**: target paths, arguments, working directories
  
  ## Search Strategy & Tool Usage
  
  **Query Parameter Guide**:
  - **event_type**: Use for filtering by artifact type (supports wildcards: "evtx_*", "registry_*")
  - **event_ts**: Use for temporal analysis (timerange queries with start_time/end_time)
  - **payload**: Use for content searches (usernames, IPs, filenames, registry keys)
  
  **Best Practices**:
  1. **Start broad**: Use `count_events` to understand data volume (e.g., count_events(event_type="evtx_*"))
  2. **Filter by type**: Use `search_events_by_type` to focus on specific artifacts (e.g., "evtx_security_4624" for logons)
  3. **Search content**: Use `search_events_by_content` to find IOCs (e.g., search_term="192.168.1.100")
  4. **Temporal analysis**: Use `search_events_by_timerange` to find events in specific time windows
  5. **Compound queries**: Chain `query_jsonb_field` calls to progressively filter results
  6. **Pattern discovery**: Use `aggregate_jsonb_field` to find common values before filtering
  7. **Pagination**: Default limit is 10, max is 50 - use offset to retrieve more results
  8. **Examine payloads**: Always inspect the payload JSONB to understand event context
  9. **Register timeline**: Use `register_timeline_entry` for important events (auto-fetches complete data)
  10. **Complete**: Call `complete_investigation` when you've answered the question
  
  **COMPOUND JSONB QUERIES**:
  You can make multiple sequential queries to filter results:
  - First: `search_events_by_type(event_type="evtx_security_4624", description="All logon events")` → Get all logons
  - Second: `query_jsonb_field(jsonb_path="event_data.TargetUserName", operator="=", value="admin", event_type="evtx_security_4624", description="Filter by admin account")` → Filter to admin
  - Third: `query_jsonb_field(jsonb_path="event_data.LogonType", operator="=", value="3", event_type="evtx_security_4624", description="Network logons only")` → Filter by logon type
  
  Use `aggregate_jsonb_field` to discover common values before filtering:
  - `aggregate_jsonb_field(jsonb_path="event_data.TargetUserName", aggregation="top_values", description="Find most targeted accounts")` → See which accounts are most common
  - Then query for the specific account you're interested in
  
  **Example Workflow**:
  1. count_events(event_type="evtx_*") → Understand how many Windows events exist
  2. search_events_by_type(event_type="evtx_security_4624", limit=10) → Get sample logon events
  3. search_events_by_content(search_term="Administrator", event_type="evtx_*") → Find admin activity
  4. search_events_by_timerange(start_time="2023-03-24T12:00:00Z", end_time="2023-03-24T13:00:00Z") → Focus on specific hour
  5. register_graph_node for suspicious events, register_graph_edge to show relationships

estimated_duration: "2-5 minutes"
