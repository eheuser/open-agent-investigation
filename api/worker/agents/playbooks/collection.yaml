name: collection
display_name: Data Collection
description: Investigation strategies for detecting data collection - identifying gathering of sensitive files, screenshots, clipboard data, and staging for exfiltration

playbook: |
  ## COLLECTION INVESTIGATION PLAYBOOK
  
  ### What is Collection?
  Techniques attackers use to gather data of interest before exfiltration - the "what to steal" phase.
  
  ### Key Indicators to Investigate:
  
  1. **File Archiving/Compression Detection**
     - **PRIORITY**: Use `query_analysis_module` with module_id='execution_evidence' for comprehensive archiving tool detection
     - **Process Creation** (event_type='evtx_sysmon_1'):
       - Fields: event_data.Image, event_data.CommandLine
       - Look for archiving tools and compression commands
     - **File Creation** (event_type='evtx_sysmon_11'):
       - Fields: event_data.TargetFilename
       - Look for: .7z, .zip, .rar files in staging locations (Temp, Public, AppData)
     - Red flags: Large archives, compression of entire directories
  
  2. **Sensitive File Access**
     - **Object Access** (event_type='evtx_security_4663'): Requires auditing enabled
     - **File Creation** (event_type='evtx_sysmon_11'): Archives and copies
     - Look for common document and data file extensions
     - Tool: `search_events_by_content` with search_text='.docx' or '.xlsx' or '.pdf', event_type='evtx_security_4663', description='Sensitive file access'
     - Look for: Access to Documents, Desktop, network shares
     - Red flags: Bulk file access, unusual accounts accessing sensitive data
  
  3. **Data Staging Directories**
     - **MFT** (event_type='mft_entry'): File system timeline
     - **File Creation** (event_type='evtx_sysmon_11'): Staging directory creation
     - Look for temporary directories for collected data:
       - C:\Temp\
       - C:\ProgramData\
       - C:\Users\Public\
       - C:\Windows\Temp\
     - Tool: `search_events_by_content` with search_text='C:\\Temp\\' or 'C:\\ProgramData\\', description='Data staging directories'
     - Look for: Large file creations, unusual directory names
     - Red flags: Directories named after dates, random strings
  
  4. **Screenshot/Screen Capture Detection**
     - **PRIORITY**: Use `query_analysis_module` with module_id='execution_evidence' for screenshot tool detection
     - **Process Creation** (event_type='evtx_sysmon_1'):
       - Fields: event_data.Image, event_data.CommandLine
       - PowerShell commands: `[System.Windows.Forms.Screen]`, `[System.Drawing.Bitmap]`
       - Tool: `search_events_by_content` with search_text='screenshot' or 'bitmap' or 'System.Drawing', description='Screenshot tool execution'
     - Red flags: Automated screenshot tools, frequent captures
  
  5. **Clipboard Data Collection**
     - Stealing copied passwords, data
     - PowerShell: `Get-Clipboard`
     - Tool: `search_events_by_content` with search_text='Get-Clipboard', description='Clipboard data collection'
     - Red flags: Continuous clipboard monitoring
  
  6. **Email Collection Detection**
     - **File Creation** (event_type='evtx_sysmon_11'):
       - Fields: event_data.TargetFilename
       - Look for: email data files in unusual locations
     - **Process Creation** (event_type='evtx_sysmon_1'):
       - Tool: `search_events_by_content` with search_text='.pst' or '.ost' or 'MailboxExport', description='Email collection activity'
     - Red flags: PST exports, mailbox access by unusual accounts
  
  7. **Database Dumping Detection**
     - **PRIORITY**: Use `query_analysis_module` with module_id='execution_evidence' for database tool detection
     - **Process Creation** (event_type='evtx_sysmon_1'):
       - Fields: event_data.Image, event_data.CommandLine
       - Tool: `search_events_by_content` with search_text='mysqldump' or 'pg_dump' or 'sqlcmd', description='Database dumping tools'
     - Red flags: Database dumps to unusual locations
  
  8. **Network Share Collection**
     - **Share Access** (event_type='evtx_security_5140'): Network share accessed
     - **Share Object Access** (event_type='evtx_security_5145'): Network share object accessed
     - Fields: event_data.ShareName, event_data.RelativeTargetName, event_data.IpAddress
     - Tool: `aggregate_jsonb_field` with jsonb_path='event_data.ShareName', event_type='evtx_security_5140', description='Network share access patterns'
     - Look for: Bulk access to shares, unusual accounts
     - Red flags: Accessing multiple shares, copying entire directories
  
  9. **Browser Data Collection**
     - **File Creation** (event_type='evtx_sysmon_11')
     - Look for browser data files being copied or accessed:
       - Chrome: `Login Data`, `History`, `Cookies`
       - Firefox: `logins.json`, `places.sqlite`, `cookies.sqlite`
       - Edge: Similar to Chrome
     - Tool: `search_events_by_content` with search_text='Login Data' or 'logins.json', description='Browser data collection'
     - Red flags: Copying browser data stores
  
  10. **Cloud Storage Synchronization**
     - Using cloud services to collect/stage data
     - Tools: OneDrive, Dropbox, Google Drive clients
     - Query: Check for cloud sync processes accessing sensitive files
     - Red flags: Unusual cloud sync activity, new cloud accounts
  
  ### Investigation Strategy:
  
  **Phase 1 - Identify Collection Activity**
      - Look for archiving tool execution
    - Check for file staging directories
    - Query for sensitive file access (event_type='evtx_security_4663' or 'evtx_sysmon_11')
  
  **Phase 2 - Determine What Was Collected**
  - Analyze archive contents (if available)
  - Check file access logs for specific documents
  - Look for database dumps, PST exports
  
  **Phase 3 - Locate Staging Areas**
  - Check MFT for temporary directories
  - Look for large files in unusual locations
  - Identify archive files created
  
  **Phase 4 - Timeline Analysis**
  - When did collection occur?
  - How long did it last? (Hours, days)
  - Was it automated or manual?
  - What happened next? (Exfiltration)
  
  ### Common Patterns:
  
  - **Manual Collection**: User navigates directories → Copies files → Creates archive
  - **Automated Collection**: Script runs → Searches for file types → Archives → Stages
  - **Email Theft**: PST export → Copy to staging → Compress → Exfiltrate
  - **Database Theft**: SQL dump → Compress → Stage → Exfiltrate
  - **Credential Theft**: Browser data → Registry SAM → LSASS dump → Archive
  
  ### File Type Indicators:
  
  **High-Value Targets** (common collection targets):
  - Documents: *.docx, *.xlsx, *.pdf, *.pptx
  - Databases: *.sql, *.mdb, *.accdb, *.db
  - Email: *.pst, *.ost, *.eml
  - Archives: *.zip, *.7z, *.rar, *.tar.gz
  - Source Code: *.py, *.java, *.cpp, *.cs
  - Configuration: *.conf, *.ini, *.xml, *.json
  - Credentials: *.kdbx (KeePass), *.agilekeychain (1Password)
  
  ### Archiving Command Patterns:
  
  ```
  # 7-Zip
  7z.exe a -r archive.7z C:\Users\*\Documents\*
  7z.exe a -p<password> secure.7z sensitive_data\
  
  # PowerShell
  Compress-Archive -Path C:\Data\* -DestinationPath C:\Temp\data.zip
  
  # RAR
  rar.exe a -r -hp<password> archive.rar C:\Sensitive\
  
  # Built-in Windows
  makecab /D CompressionType=LZX /D CompressionMemory=21 data.txt data.cab
  ```
  
  ### Key Questions to Answer:
  
  1. What data was collected? (File types, directories, databases)
  2. How was it collected? (Manual, scripted, automated tools)
  3. Where was it staged? (Temporary directories, archives)
  4. When did collection occur? (Timeline)
  5. How much data was collected? (File sizes, counts)
  6. Was it encrypted/compressed? (Archive passwords)
  7. Was it exfiltrated? (Check for subsequent network activity)
  
  ### Volume Indicators:
  
  - **Small Collection**: <100MB, targeted files (credentials, specific documents)
  - **Medium Collection**: 100MB-1GB, department data, email archives
  - **Large Collection**: >1GB, database dumps, entire shares
  - **Bulk Collection**: >10GB, mass exfiltration attempt
  
  ### Behavioral Indicators:
  
  - **Targeted**: Specific file types, known sensitive directories
  - **Opportunistic**: Broad searches (*.xlsx, *.pdf), entire user profiles
  - **Systematic**: Organized by date/type, methodical directory traversal
  - **Rushed**: Quick bulk copies, no organization, large archives
