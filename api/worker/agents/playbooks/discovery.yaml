name: discovery
display_name: Discovery
description: Investigation strategies for detecting discovery activities - identifying reconnaissance commands used to map networks, enumerate systems, and gather information

playbook: |
  ## DISCOVERY INVESTIGATION PLAYBOOK
  
  ### What is Discovery?
  Techniques attackers use to gain knowledge about systems, networks, and environments after initial compromise.
  
  ### Key Indicators to Investigate:
  
  1. **Network Discovery Commands Detection**
     - **PRIORITY**: Use `query_analysis_module` with module_id='execution_evidence' for comprehensive execution view
     - **Process Creation** (event_type='evtx_sysmon_1' or 'evtx_security_4688'):
       - Fields: event_data.Image, event_data.CommandLine, event_data.ParentImage
       - Tool: `search_events_by_content` with search_text='net.exe' or 'nltest' or 'ipconfig', description='Network discovery commands'
     - Look for network enumeration patterns
     - Red flags: Rapid succession of recon commands
  
  2. **User/Group Enumeration Detection**
     - **PRIORITY**: Use `query_analysis_module` with module_id='execution_evidence' for comprehensive execution view
     - **Process Creation** (event_type='evtx_sysmon_1' or 'evtx_security_4688'):
       - Fields: event_data.Image, event_data.CommandLine
       - Tool: `search_events_by_content` with search_text='net user' or 'net group' or 'whoami', description='User enumeration commands'
     - Look for user, group, and privilege enumeration patterns
     - Red flags: Enumeration of admin groups, privilege checks
  
  3. **System Information Gathering Detection**
     - **PRIORITY**: Use `query_analysis_module` with module_id='execution_evidence' for comprehensive execution view
     - **Process Creation** (event_type='evtx_sysmon_1' or 'evtx_security_4688'):
       - Fields: event_data.Image, event_data.CommandLine
       - Tool: `search_events_by_content` with search_text='systeminfo' or 'tasklist' or 'wmic', description='System information gathering'
     - Look for OS, network, and process enumeration patterns
     - Red flags: Automated enumeration scripts
  
  4. **File/Share Discovery Detection**
     - **Share Access** (event_type='evtx_security_5140'): Network share access
       - Fields: event_data.ShareName, event_data.IpAddress
       - Tool: `aggregate_jsonb_field` with jsonb_path='event_data.ShareName', event_type='evtx_security_5140', description='Share enumeration patterns'
     - **Process Creation** (event_type='evtx_sysmon_1' or 'evtx_security_4688'):
       - Tool: `search_events_by_content` with search_text='net view' or 'net share', description='Share discovery commands'
     - Look for: Access to administrative shares
     - Red flags: Enumeration of multiple shares, access to sensitive shares
  
  5. **Process Discovery Detection**
     - **PRIORITY**: Use `query_analysis_module` with module_id='execution_evidence' for comprehensive execution view
     - **Process Creation** (event_type='evtx_sysmon_1' or 'evtx_security_4688'):
       - Fields: event_data.Image, event_data.CommandLine
       - Tool: `search_events_by_content` with search_text='tasklist' or 'Get-Process' or 'sc query', description='Process enumeration'
     - Look for process and service enumeration patterns
     - Red flags: Looking for security tools (AV, EDR)
  
  6. **Remote System Discovery Detection**
     - **Network Connection** (event_type='evtx_sysmon_3'):
       - Tool: `aggregate_jsonb_field` with jsonb_path='event_data.DestinationIp', event_type='evtx_sysmon_3', description='Network scanning pattern detection'
     - **Process Creation** (event_type='evtx_sysmon_1' or 'evtx_security_4688'):
       - Tool: `search_events_by_content` with search_text='ping' or 'nmap' or 'arp', description='Network scanning tools'
     - Red flags: Connections to multiple hosts in short time
  
  7. **Domain/Network Trust Discovery**
     - **Process Creation** (event_type='evtx_sysmon_1' or 'evtx_security_4688')
     - Mapping Active Directory structure
     - Look for domain trust and DC enumeration patterns
     - Tool: `search_events_by_content` with search_text='nltest /domain_trusts' or 'Get-ADTrust', description='Domain trust enumeration'
     - Red flags: Enumeration of trust relationships (lateral movement prep)
  
  8. **Software Discovery Detection**
     - **PRIORITY**: Use `query_analysis_module` with module_id='execution_evidence' for installed software view
     - **Process Creation** (event_type='evtx_sysmon_1' or 'evtx_security_4688'):
       - Tool: `search_events_by_content` with search_text='wmic product' or 'Get-WmiObject Win32_Product', description='Software enumeration'
     - Red flags: Looking for security software to evade
  
  9. **Scheduled Task/Service Discovery**
     - **Process Creation** (event_type='evtx_sysmon_1' or 'evtx_security_4688')
     - Enumerating persistence locations
     - Look for task and service enumeration patterns
     - Tool: `search_events_by_content` with search_text='schtasks' or 'Get-ScheduledTask' or 'sc query', description='Task/service enumeration'
     - Red flags: Enumeration before creating malicious tasks
  
  10. **Clipboard/Screen Capture**
     - **Process Creation** (event_type='evtx_sysmon_1' or 'evtx_security_4688')
     - Stealing sensitive data from user workspace
     - Look for clipboard and screen capture tool patterns
     - Tool: `search_events_by_content` with search_text='Get-Clipboard' or 'screenshot' or 'System.Drawing.Bitmap', description='Clipboard/screen capture'
     - Red flags: Clipboard access, screen capture tools
  
  ### Investigation Strategy:
  
  **Phase 1 - Identify Discovery Phase Using Execution Artifacts**
  - **PRIORITY**: Use execution artifacts to detect recon tools:
    - **Prefetch** (event_type='prefetch_execution'): Search for reconnaissance tool execution
    - **AmCache** (event_type='registry_amcache'): Get execution times and hashes
    - **SRUM** (event_type='srum_data'): Network activity by reconnaissance tools
  - **Process Creation** (event_type='evtx_sysmon_1' or 'evtx_security_4688'):
    - Fields: event_data.Image, event_data.CommandLine, event_data.ParentImage
    - Look for rapid succession of recon commands
  - Typically occurs shortly after initial access
  - Check for automated scripts (multiple commands in seconds)
  
  **Phase 2 - Categorize Discovery**
  - **Network**: Network enumeration patterns (check Prefetch for execution)
  - **Users/Groups**: User/group enumeration patterns (check Prefetch for execution)
  - **System**: System information gathering patterns (check Prefetch for execution)
  - **Shares**: Share enumeration, event_type='evtx_security_5140'
  
  **Phase 3 - Timeline Analysis**
  - When did discovery occur? (After initial access, before lateral movement)
  - How long did it last? (Minutes vs hours)
  - Was it automated? (Script vs manual commands)
  - **Use Prefetch**: Multiple execution times show repeated reconnaissance
  
  **Phase 4 - Correlation**
  - What was discovered? (Admin accounts, domain trusts, network shares)
  - What happened next? (Lateral movement, privilege escalation)
  - Did discovery inform subsequent attacks?
  - **Cross-reference**: Prefetch execution times with network logons (event_type='evtx_security_4624' Type 10)
  
  ### Common Patterns:
  
  - **Initial Recon**: User enumeration → system info → network config → domain users
  - **Network Mapping**: Network view → ping sweep → ARP enumeration
  - **Privilege Check**: Privilege enumeration → local admin check
  - **Domain Recon**: Domain admin enumeration → trust enumeration
  - **Pre-Lateral Movement**: Network view → share connection → remote directory listing
  
  ### Command Clustering:
  
  Attackers often run discovery commands in rapid succession (scripted recon).
  
  **Detection**: Aggregate by process parent and timestamp - look for 5+ commands in <60 seconds
  
  ### Key Questions to Answer:
  
  1. What discovery commands were executed?
  2. When did discovery occur? (Timeline relative to compromise)
  3. Was it automated or manual? (Script vs interactive)
  4. What was the attacker looking for? (Admins, shares, trusts)
  5. What information was gathered? (Successful enumeration)
  6. Did discovery lead to lateral movement or privilege escalation?
  
  ### Behavioral Indicators:
  
  - **Scripted Recon**: Multiple commands, same parent process, rapid execution
  - **Manual Recon**: Varied timing, interactive commands, typos/corrections
  - **Targeted**: Focus on specific systems, accounts, or shares
  - **Broad**: Sweeping network scans, all domain users, all shares
