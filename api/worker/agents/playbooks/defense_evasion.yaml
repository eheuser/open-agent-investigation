name: defense_evasion
display_name: Defense Evasion
description: Investigation strategies for detecting defense evasion - identifying attempts to avoid detection through obfuscation, disabling security tools, and hiding artifacts

playbook: |
  ## DEFENSE EVASION INVESTIGATION PLAYBOOK
  
  ### What is Defense Evasion?
  Techniques attackers use to avoid detection by security tools, hide their presence, and remove evidence.
  
  ### Key Indicators to Investigate:
  
  1. **Security Tool Tampering Detection**
     - **PRIORITY**: Use execution artifacts to detect tampering tools:
       - **Prefetch** (event_type='prefetch_execution')
       - **AmCache** (event_type='registry_amcache')
       - **ShimCache** (event_type='registry_shimcache')
     - **Process Creation** (event_type='evtx_sysmon_1' or 'evtx_security_4688'):
       - Fields: event_data.Image, event_data.CommandLine, event_data.ParentImage
       - Query: `search_events_by_content` for security tool tampering patterns
     - Red flags: Commands disabling security tools, stopping security services
  
  2. **Event Log Clearing**
     - **Security Log Cleared** (event_type='evtx_security_1102'): Security log clearing
     - **System Log Cleared** (event_type='evtx_system_104'): System log clearing
     - Attackers clear logs to hide activity
     - Fields: event_data.SubjectUserName
     - Look for: When logs were cleared (gap in timeline), who cleared them
  
  3. **File Deletion / Timestomping**
     - **File Delete** (event_type='evtx_sysmon_23'): File deletions (requires ArchiveDirectory config)
     - **Process Creation Time Changed** (event_type='evtx_sysmon_2'): File creation time changes
     - Fields: event_data.TargetFilename, event_data.CreationUtcTime
     - Red flags: Deletion of tools, timestomping to match legitimate files
  
  4. **Obfuscated Commands Detection**
     - **Process Creation** (event_type='evtx_sysmon_1' or 'evtx_security_4688'):
       - Fields: event_data.CommandLine, event_data.Image
       - Query: `search_events_by_content` for obfuscation patterns
     - **Prefetch** (event_type='prefetch_execution'): Search for scripting engine execution
     - Look for encoding, character obfuscation, and environment variable abuse patterns
  
  5. **Process Injection**
     - **CreateRemoteThread** (event_type='evtx_sysmon_8'): Remote thread creation
     - **ProcessAccess** (event_type='evtx_sysmon_10'): Cross-process memory access
     - Fields: event_data.SourceImage, event_data.TargetImage, event_data.GrantedAccess
     - Red flags: Unusual processes accessing system processes
     - Look for suspicious GrantedAccess patterns
  
  6. **Masquerading Detection**
     - **PRIORITY**: Use execution artifacts to detect masquerading:
       - **Prefetch** (event_type='prefetch_execution'): Search for 'svchost.exe', 'lsass.exe', 'csrss.exe' in unusual paths
       - **AmCache** (event_type='registry_amcache'): Check OriginalFileName vs file path
       - **ShimCache** (event_type='registry_shimcache'): Detect suspicious file locations
     - **Process Creation** (event_type='evtx_sysmon_1' or 'evtx_security_4688'):
       - Fields: event_data.Image, event_data.OriginalFileName, event_data.CurrentDirectory
       - Query: `search_events_by_content` for system process names in unusual paths
     - Red flags: 
       - System processes running from non-system directories
       - Misspelled system process names
       - Legitimate names in wrong locations
  
  7. **Indicator Removal**
     - **MFT** (event_type='mft_entry'): File system timeline
     - **Prefetch** (event_type='prefetch_execution'): Execution artifacts
     - **Registry Object Created/Deleted** (event_type='evtx_sysmon_12'): Registry key deletion
     - Fields: event_data.TargetObject (registry), event_data.TargetFilename (files)
     - Look for: Gaps in forensic artifacts
  
  8. **Disabling Windows Defender**
     - **Defender Disabled** (event_type='evtx_defender_5001'): Windows Defender disabled
     - **Registry Value Set** (event_type='evtx_sysmon_13'): Registry modifications
     - Fields: event_data.TargetObject
     - Query: `query_jsonb_field` with jsonb_path='event_data.TargetObject', value='%Disable%'
     - Red flags: Registry changes to security policies
  
  9. **DLL Side-Loading / Hijacking**
     - **Image Loaded** (event_type='evtx_sysmon_7'): DLL load events
     - Placing malicious DLL in application directory
     - Fields: event_data.ImageLoaded, event_data.Signed, event_data.SignatureStatus
     - Query: event_type='evtx_sysmon_7' with Signed='false'
     - Red flags: Unsigned DLLs loaded by legitimate processes
  
  10. **Alternate Data Streams (ADS)**
     - **MFT** (event_type='mft_entry'): File system metadata
     - Hiding data in NTFS alternate streams
     - Query: `search_events_by_content` for alternate stream patterns
     - Red flags: Executables hidden in ADS
  
  ### Investigation Strategy:
  
  **Phase 1 - Identify Evasion Techniques**
  - Check for log clearing events (event_type='evtx_security_1102' or 'evtx_system_104')
  - Query for security tool tampering commands
  - Look for obfuscated PowerShell/cmd commands
  - **Use Prefetch/AmCache**: Even if logs are cleared, execution artifacts survive
  
  **Phase 2 - Timeline Gaps & Artifact Reconstruction**
  - Identify when logs were cleared (missing time periods)
  - **CRITICAL**: Cross-reference with execution artifacts that survive log clearing:
    - **Prefetch** (event_type='prefetch_execution') - Survives log clearing, shows last 8 execution times
    - **AmCache** (event_type='registry_amcache') - Survives log clearing, contains SHA-1 hashes
    - **ShimCache** (event_type='registry_shimcache') - Survives log clearing, proves file presence
    - **SRUM** (event_type='srum_data') - Survives log clearing, shows network activity
    - **MFT** (event_type='mft_entry') - Survives log clearing, file system timeline
  - **Use Analysis Module**: `query_analysis_module` with module_id='execution_evidence' for comprehensive view
  
  **Phase 3 - Process Analysis**
  - Process injection (event_type='evtx_sysmon_8' or 'evtx_sysmon_10')
  - Process creation (event_type='evtx_sysmon_1' or 'evtx_security_4688') with command line
  - Image load (event_type='evtx_sysmon_7') for DLL side-loading
  - Identify masquerading (legitimate names in wrong paths)
  - **AmCache for signatures**: Check event_type='registry_amcache' for unsigned executables
  
  **Phase 4 - Artifact Removal Detection**
  - Check for deleted files (event_type='evtx_sysmon_23' or 'mft_entry')
  - Look for timestomping (event_type='evtx_sysmon_2')
  - **Prefetch analysis**: Missing prefetch files indicate cleanup attempts
  - **Registry analysis**: Deleted registry keys
  
  ### Common Patterns:
  
  - **Initial Evasion**: Disable Defender → Clear logs → Execute payload
  - **Obfuscation**: Base64 PowerShell → Process injection → Fileless execution
  - **Cleanup**: Delete tools → Clear prefetch → Timestomp files → Clear logs
  - **Masquerading**: svchost.exe in AppData → Unsigned DLL side-loading
  
  ### Key Questions to Answer:
  
  1. What security tools were disabled? (AV, firewall, logging)
  2. Were logs cleared? (When, which logs, by whom)
  3. What obfuscation techniques were used? (Encoding, injection, masquerading)
  4. What artifacts were removed? (Files, registry keys, logs)
  5. Can deleted artifacts be recovered? (Check MFT, volume shadow copies)
  6. What is the timeline of evasion activity? (Before/after other attack phases)
