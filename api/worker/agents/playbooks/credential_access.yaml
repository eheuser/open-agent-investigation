name: credential_access
display_name: Credential Access
description: Investigation strategies for detecting credential access - identifying credential dumping, password attacks, and theft of authentication materials

playbook: |
  ## CREDENTIAL ACCESS INVESTIGATION PLAYBOOK
  
  ### What is Credential Access?
  Techniques attackers use to steal credentials (passwords, hashes, tokens) to expand access and move laterally.
  
  ### Key Indicators to Investigate:
  
  1. **LSASS Memory Dumping**
     - **Process Access** (event_type='evtx_sysmon_10'): Most common credential theft technique
     - Fields: event_data.TargetImage, event_data.SourceImage, event_data.GrantedAccess
     - Tool: `query_jsonb_field` with jsonb_path='event_data.TargetImage', operator='ILIKE', value='%lsass.exe%', description='LSASS access detection'
     - Red flags: Non-system processes accessing lsass.exe
     - GrantedAccess flags to watch:
       - 0x1010: PROCESS_VM_READ (read memory)
       - 0x1F0FFF: PROCESS_ALL_ACCESS (full access)
       - 0x1410: Common access pattern
     - Legitimate accessors: System processes only
     - Suspicious: Scripting engines, command interpreters, custom executables
  
  2. **Credential Dumping Tools Detection**
     - **PRIORITY**: Use `query_analysis_module` with module_id='execution_evidence' for comprehensive view
     - **Prefetch** (event_type='prefetch_execution'): Search for credential dumping tool execution
     - **AmCache** (event_type='registry_amcache'): Get SHA-1 hashes for threat intel lookup
     - **ShimCache** (event_type='registry_shimcache'): Shows file presence even if deleted
     - **Process Creation** (event_type='evtx_sysmon_1'):
       - Fields: event_data.Image, event_data.CommandLine, event_data.Hashes
       - Look for credential dumping tool patterns and suspicious DLL usage
     - Command patterns:
       - `procdump.exe -ma lsass.exe lsass.dmp`
       - `rundll32.exe comsvcs.dll MiniDump <lsass_pid> dump.bin full`
       - `taskmgr.exe` creating lsass.dmp
     - Red flags: Any lsass dump creation, sekurlsa commands
  
  3. **Registry Hive Access**
     - **Registry Object Created/Deleted** (event_type='evtx_sysmon_12'): Registry key creation/deletion
     - **Registry Value Set** (event_type='evtx_sysmon_13'): Registry value modifications
     - Offline credential extraction from SAM/SYSTEM/SECURITY hives
     - Fields: event_data.TargetObject
     - Tool: `search_events_by_content` with search_text='SAM' or 'SECURITY', event_type='evtx_sysmon_12', description='Registry hive access'
     - Also check for: `reg save HKLM\SAM` commands
     - Red flags: Registry hive exports, VSS shadow copy access
  
  4. **NTDS.dit Access**
     - **Process Creation** (event_type='evtx_security_4688' or 'evtx_sysmon_1')
     - **File Creation** (event_type='evtx_sysmon_11')
     - Domain controller credential database access
     - Fields: event_data.TargetFilename, event_data.CommandLine
     - Tool: `search_events_by_content` with search_text='ntds.dit' or 'ntdsutil', description='NTDS.dit access detection'
     - Commands to look for:
       - `ntdsutil "ac i ntds" "ifm" "create full"`
       - VSS shadow copy of NTDS.dit
     - Red flags: NTDS.dit copied outside System32
  
  5. **Kerberos Attacks**
     - **TGT Request** (event_type='evtx_security_4768'): Kerberos TGT request
     - **Service Ticket Request** (event_type='evtx_security_4769'): Kerberos service ticket request
     - **Pre-authentication Failed** (event_type='evtx_security_4771'): Kerberos pre-auth failures
     - Event 4771: Kerberos pre-authentication failed
     - Fields: event_data.TargetUserName, event_data.IpAddress, event_data.ServiceName
     - Tool patterns:
       - **Kerberoasting**: `search_events_by_type` with event_type='evtx_security_4769', then `aggregate_jsonb_field` with jsonb_path='event_data.ServiceName'
       - **AS-REP Roasting**: `query_jsonb_field` with jsonb_path='event_data.PreAuthType', value='0', event_type='evtx_security_4768'
       - **Golden/Silver Ticket**: `aggregate_jsonb_field` with jsonb_path='event_data.TicketEncryptionType', event_type='evtx_security_4769'
     - Red flags: Bulk ticket requests, encryption downgrades
  
  6. **Brute Force / Password Spraying**
     - **Failed Logon** (event_type='evtx_security_4625'): Failed authentication attempts
     - **Kerberos Pre-auth Failed** (event_type='evtx_security_4771'): Kerberos authentication failures
     - Fields: event_data.TargetUserName, event_data.IpAddress, event_data.FailureReason
     - Tool: `aggregate_jsonb_field` with jsonb_path='event_data.IpAddress' or 'event_data.TargetUserName', event_type='evtx_security_4625', description='Brute force pattern analysis'
     - Patterns:
       - **Brute Force**: Many attempts against single account
       - **Password Spray**: One attempt against many accounts
     - Red flags: 
       - >5 failures in 10 minutes (brute force)
       - Same source IP, different accounts (spray)
  
  7. **DCSync Attack**
     - **Directory Service Access** (event_type='evtx_security_4662')
     - Replicating domain credentials using Directory Replication Service
     - Fields: event_data.Properties (look for replication GUIDs)
     - Tool: `search_events_by_content` with search_text='1131f6aa-9c07-11d1-f79f-00c04fc2dcd2', event_type='evtx_security_4662', description='DCSync replication detection'
     - Red flags: Non-DC computers performing replication
     - Look for: Unusual accounts with DS-Replication-Get-Changes rights
  
  8. **Cached Credential Access**
     - LSA secrets, cached domain credentials
     - Registry: HKLM\SECURITY\Cache
     - Tool: `search_events_by_content` with search_text='SECURITY\\Cache', description='Cached credential access'
     - Red flags: Non-system processes accessing cached credentials
  
  9. **Browser Credential Theft**
     - Stealing saved passwords from browsers
     - Files: Login Data, Cookies (Chrome), logins.json (Firefox)
     - Tool: `search_events_by_content` with search_text='Login Data' or 'logins.json', description='Browser credential theft'
     - Red flags: Processes accessing browser credential stores
  
  10. **Token Impersonation**
     - **Special Privileges Assigned** (event_type='evtx_security_4672'): SeDebugPrivilege and other sensitive privileges
     - **Explicit Credential Logon** (event_type='evtx_security_4648'): RunAs and explicit credential usage
     - Fields: event_data.PrivilegeList, event_data.TargetUserName
     - Tool: `search_events_by_type` with event_type='evtx_security_4672', description='Privilege assignment detection'
     - Red flags: Non-admin accounts with SeDebugPrivilege
  
  ### Investigation Strategy:
  
      **Phase 1 - Identify Credential Theft**
    - Check for lsass.exe access (event_type='evtx_sysmon_10')
    - Query for credential dumping tool execution
    - Look for registry hive access
  
  **Phase 2 - Analyze Attack Method**
  - LSASS dump: Check SourceImage, GrantedAccess
  - Registry: Check for reg save or VSS commands
  - Kerberos: Identify ticket requests, encryption types
  
  **Phase 3 - Assess Scope**
  - Which accounts were targeted?
  - Were credentials successfully stolen?
  - Check for subsequent lateral movement using stolen creds
  
  **Phase 4 - Timeline Correlation**
  - When did credential theft occur?
  - What happened immediately after? (Lateral movement, privilege escalation)
  - Cross-reference with Event 4648, 4624 (credential usage)
  
  ### Common Patterns:
  
  - **Mimikatz**: powershell.exe → lsass.exe access → sekurlsa::logonpasswords
  - **ProcDump**: procdump.exe -ma lsass.exe → lsass.dmp created → File exfiltration
  - **DCSync**: Domain admin compromise → Event 4662 replication → All domain hashes stolen
  - **Kerberoasting**: Service ticket requests (4769) → Offline cracking → Lateral movement
  - **Password Spray**: Event 4625 across multiple accounts → Single success → Persistence
  
  ### Key Questions to Answer:
  
  1. What credential theft technique was used?
  2. Which credentials were targeted? (User accounts, service accounts, domain admin)
  3. Were credentials successfully stolen? (Check for dump files, exfiltration)
  4. When did the theft occur? (Timeline)
  5. What was done with stolen credentials? (Lateral movement, privilege escalation)
  6. Which accounts should be reset? (Compromised credentials)
  
  ### Remediation Indicators:
  
  - Reset passwords for all accounts accessed during the attack
  - Revoke Kerberos tickets if golden/silver ticket suspected
  - Check for persistence mechanisms created with stolen credentials
  - Monitor for continued use of compromised accounts
