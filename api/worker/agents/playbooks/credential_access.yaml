name: credential_access
description: Investigation strategies for detecting credential access - identifying credential dumping, password attacks, and theft of authentication materials

playbook: |
  ## CREDENTIAL ACCESS INVESTIGATION PLAYBOOK
  
  ### What is Credential Access?
  Techniques attackers use to steal credentials (passwords, hashes, tokens) to expand access and move laterally.
  
  ### Key Indicators to Investigate:
  
  1. **LSASS Memory Dumping (Sysmon 10)**
     - Most common credential theft technique
     - Fields: EventData.TargetImage, EventData.SourceImage, EventData.GrantedAccess
     - Query: `query_jsonb_field` with jsonb_path='EventData.TargetImage', operator='ILIKE', value='%lsass.exe%'
     - Red flags: Non-system processes accessing lsass.exe
     - GrantedAccess flags to watch:
       - 0x1010: PROCESS_VM_READ (read memory)
       - 0x1F0FFF: PROCESS_ALL_ACCESS (full access)
       - 0x1410: Common Mimikatz access pattern
     - Legitimate accessors: svchost.exe, csrss.exe, wininit.exe
     - Suspicious: powershell.exe, cmd.exe, rundll32.exe, custom executables
  
  2. **Credential Dumping Tools (Event ID 4688, Sysmon 1)**
     - Mimikatz, ProcDump, Comsvcs.dll, Task Manager
     - Fields: EventData.CommandLine, EventData.NewProcessName
     - Query: `search_events_by_content` for 'mimikatz', 'procdump', 'comsvcs.dll'
     - Command patterns:
       - `procdump.exe -ma lsass.exe lsass.dmp`
       - `rundll32.exe comsvcs.dll MiniDump <lsass_pid> dump.bin full`
       - `taskmgr.exe` creating lsass.dmp
     - Red flags: Any lsass dump creation, sekurlsa commands
  
  3. **SAM/SYSTEM/SECURITY Registry Hive Access (Sysmon 12, 13)**
     - Offline credential extraction
     - Fields: EventData.TargetObject
     - Query: `query_jsonb_field` with jsonb_path='EventData.TargetObject', value='%SAM%' or '%SECURITY%'
     - Also check for: `reg save HKLM\SAM` commands
     - Red flags: Registry hive exports, VSS shadow copy access
  
  4. **NTDS.dit Access (Event ID 4688, Sysmon 11)**
     - Domain controller credential database
     - Fields: EventData.TargetFilename, EventData.CommandLine
     - Query: `search_events_by_content` for 'ntds.dit', 'ntdsutil'
     - Commands to look for:
       - `ntdsutil "ac i ntds" "ifm" "create full"`
       - VSS shadow copy of NTDS.dit
     - Red flags: NTDS.dit copied outside System32
  
  5. **Kerberos Attacks (Event ID 4768, 4769, 4771)**
     - Event 4768: Kerberos TGT request
     - Event 4769: Kerberos service ticket request
     - Event 4771: Kerberos pre-authentication failed
     - Fields: EventData.TargetUserName, EventData.IpAddress, EventData.ServiceName
     - Query patterns:
       - **Kerberoasting**: Event 4769 with ServiceName ending in '$' (service accounts)
       - **AS-REP Roasting**: Event 4768 with PreAuthType=0
       - **Golden/Silver Ticket**: Event 4769 with unusual encryption types (RC4 vs AES)
     - Red flags: Bulk ticket requests, encryption downgrades
  
  6. **Brute Force / Password Spraying (Event ID 4625, 4771)**
     - Multiple failed authentication attempts
     - Fields: EventData.TargetUserName, EventData.IpAddress, EventData.FailureReason
     - Query: Aggregate by IpAddress or TargetUserName
     - Patterns:
       - **Brute Force**: Many attempts against single account
       - **Password Spray**: One attempt against many accounts
     - Red flags: 
       - >5 failures in 10 minutes (brute force)
       - Same source IP, different accounts (spray)
  
  7. **DCSync Attack (Event ID 4662)**
     - Replicating domain credentials using Directory Replication Service
     - Fields: EventData.Properties (GUID 1131f6aa, 1131f6ad, 89e95b76)
     - Query: `query_jsonb_field` for Properties containing replication GUIDs
     - Red flags: Non-DC computers performing replication
     - Look for: Unusual accounts with DS-Replication-Get-Changes rights
  
  8. **Cached Credential Access**
     - LSA secrets, cached domain credentials
     - Registry: HKLM\SECURITY\Cache
     - Query: `query_jsonb_field` for 'SECURITY\\Cache'
     - Red flags: Non-system processes accessing cached credentials
  
  9. **Browser Credential Theft**
     - Stealing saved passwords from browsers
     - Files: Login Data, Cookies (Chrome), logins.json (Firefox)
     - Query: `search_events_by_content` for '%Login Data%' or '%logins.json%'
     - Red flags: Processes accessing browser credential stores
  
  10. **Token Impersonation (Event ID 4672, 4648)**
     - Event 4672: Special privileges assigned (SeDebugPrivilege)
     - Event 4648: Explicit credential logon (RunAs)
     - Fields: EventData.PrivilegeList, EventData.TargetUserName
     - Query: event_type='evtx_security_4672'
     - Red flags: Non-admin accounts with SeDebugPrivilege
  
  ### Investigation Strategy:
  
  **Phase 1 - Identify Credential Theft**
  - Check for lsass.exe access (Sysmon 10)
  - Query for credential dumping tools (Mimikatz, ProcDump)
  - Look for registry hive access (SAM, SECURITY)
  
  **Phase 2 - Analyze Attack Method**
  - LSASS dump: Check SourceImage, GrantedAccess
  - Registry: Check for reg save or VSS commands
  - Kerberos: Identify ticket requests, encryption types
  
  **Phase 3 - Assess Scope**
  - Which accounts were targeted?
  - Were credentials successfully stolen?
  - Check for subsequent lateral movement using stolen creds
  
  **Phase 4 - Timeline Correlation**
  - When did credential theft occur?
  - What happened immediately after? (Lateral movement, privilege escalation)
  - Cross-reference with Event 4648, 4624 (credential usage)
  
  ### Common Patterns:
  
  - **Mimikatz**: powershell.exe → lsass.exe access → sekurlsa::logonpasswords
  - **ProcDump**: procdump.exe -ma lsass.exe → lsass.dmp created → File exfiltration
  - **DCSync**: Domain admin compromise → Event 4662 replication → All domain hashes stolen
  - **Kerberoasting**: Service ticket requests (4769) → Offline cracking → Lateral movement
  - **Password Spray**: Event 4625 across multiple accounts → Single success → Persistence
  
  ### Key Questions to Answer:
  
  1. What credential theft technique was used?
  2. Which credentials were targeted? (User accounts, service accounts, domain admin)
  3. Were credentials successfully stolen? (Check for dump files, exfiltration)
  4. When did the theft occur? (Timeline)
  5. What was done with stolen credentials? (Lateral movement, privilege escalation)
  6. Which accounts should be reset? (Compromised credentials)
  
  ### Remediation Indicators:
  
  - Reset passwords for all accounts accessed during the attack
  - Revoke Kerberos tickets if golden/silver ticket suspected
  - Check for persistence mechanisms created with stolen credentials
  - Monitor for continued use of compromised accounts
