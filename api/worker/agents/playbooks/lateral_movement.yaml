name: lateral_movement
display_name: Lateral Movement
description: Investigation strategies for detecting lateral movement - attackers moving from one system to another within a network after initial compromise

playbook: |
  ## LATERAL MOVEMENT INVESTIGATION PLAYBOOK

  ### What is Lateral Movement?
  Attackers moving from one system to another within a network, typically after initial compromise.

  ### Key Indicators to Investigate:

  1. **Network Logons**
     - **PRIORITY**: Use `query_analysis_module` with module_id='logons' for comprehensive logon analysis
     - **Successful Logon** (event_type='evtx_security_4624'): Look for LogonType 10 (Remote Interactive)
     - Fields: event_data.TargetUserName, event_data.IpAddress, event_data.LogonType
     - Tool: `query_jsonb_field` with jsonb_path='event_data.LogonType', value='10', event_type='evtx_security_4624', description='Remote interactive logons'
     - Follow-up: `aggregate_jsonb_field` with jsonb_path='event_data.TargetUserName', event_type='evtx_security_4624', description='Accounts used across systems'

  2. **Explicit Credential Usage**
     - **Logon with Explicit Credentials** (event_type='evtx_security_4648')
     - Indicates "Run As" or explicit credential use for remote access
     - Fields: event_data.TargetUserName, event_data.TargetServerName
     - Look for: Admin accounts, unusual target servers

  3. **Remote Service Creation**
     - **Service Installed** (event_type='evtx_system_7045'): New service installation
     - **Registry Value Set** (event_type='evtx_sysmon_13'): Service registry modifications
     - Attackers often create services to execute code remotely
     - Fields: event_data.ServiceName, event_data.ImagePath
     - Red flags: Unusual service names, suspicious paths

  4. **Remote Execution Tools Detection**
     - **PRIORITY**: Use `query_analysis_module` with module_id='execution_evidence' for comprehensive execution view
     - **Process Creation** (event_type='evtx_sysmon_1' or 'evtx_security_4688'):
       - Fields: event_data.Image, event_data.CommandLine, event_data.ParentImage
     - PsExec: Look for service creation (event_type='evtx_system_7045') and execution evidence
     - WMI: Tool: `query_jsonb_field` with jsonb_path='event_data.ParentImage', operator='ILIKE', value='%wmiprvse.exe%', description='WMI remote execution'
     - PowerShell Remoting: Tool: `query_jsonb_field` with jsonb_path='event_data.ParentImage', operator='ILIKE', value='%wsmprovhost.exe%', description='PowerShell remoting'
     - Tool: `search_events_by_content` with search_text='psexec' or 'wmic' or 'winrm', description='Remote execution tools'

  5. **Admin Share Access**
     - **Share Access** (event_type='evtx_security_5140')
     - Access to administrative shares (C$, ADMIN$, IPC$) indicates remote admin activity
     - Fields: event_data.ShareName, event_data.IpAddress
     - Tool: `query_jsonb_field` with jsonb_path='event_data.ShareName', operator='ILIKE', value='%$', event_type='evtx_security_5140', description='Admin share access'
