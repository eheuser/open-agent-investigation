version: "3.9"

networks:
  oai-network:
    name: open-agent-investigation
    driver: bridge

services:
  db:
    container_name: oai-db
    image: pgvector/pgvector:pg15
    networks:
      - oai-network
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_DB: open_agent_inv
      POSTGRES_USER: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "5432:5432"

  api:
    container_name: oai-api
    build:
      context: ./api
      platforms:
        - "linux/amd64"
    networks:
      - oai-network
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:example@db/open_agent_inv
      JWT_SECRET: supersecretkey
      LLM_ENDPOINT: http://llm-service:8000/generate
      LOG_LEVEL: INFO
      LOG_FORMAT: "%(asctime)s %(levelname)s %(name)s %(message)s"
      LOG_DATEFMT: "%Y-%m-%d %H:%M:%S"
      LOG_FILE: null
      LOG_JSON: false
    ports:
      - "8000:8000"
    volumes:
      - ./api/data/policies:/app/data/policies:ro
      - ./api/data/agents:/app/data/agents:ro
      - investigations_data:/data/investigations

  worker:
    container_name: oai-worker
    build:
      context: ./api
      dockerfile: worker/Dockerfile
      platforms:
        - "linux/amd64"
    networks:
      - oai-network
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:example@db/open_agent_inv
      LOG_LEVEL: INFO
      LOG_FORMAT: "%(asctime)s %(levelname)s %(name)s %(message)s"
      LOG_DATEFMT: "%Y-%m-%d %H:%M:%S"
      LOG_FILE: null
      LOG_JSON: false
    volumes:
      - ./api/data/policies:/app/data/policies:ro
      - ./api/data/agents:/app/data/agents:ro
      - investigations_data:/data/investigations  # Read-write mount (needed for archive extraction)
      - /tmp:/tmp  # Writable temp space
    restart: unless-stopped

  ui:
    container_name: oai-ui
    build:
      context: ./ui
      platforms:
        - "linux/amd64"
    networks:
      - oai-network
    ports:
      - "443:443"
    depends_on:
      - api

volumes:
  pg_data:
    name: oai-pg-data
  investigations_data:
    name: oai-investigations-data
