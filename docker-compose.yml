version: "3.9"

networks:
  oai-network:
    name: open-agent-investigation
    driver: bridge

services:
  # Init container for volume permissions and SSL certificates
  # Auto-removes after completion to avoid container litter
  init:
    container_name: oai-init
    image: alpine:latest
    command: sh /init-setup.sh
    volumes:
      - ./init-setup.sh:/init-setup.sh:ro
      - investigations_data:/data/investigations
      - pg_data:/data/postgres
      - ./certs:/certs
    networks:
      - oai-network

  db:
    container_name: oai-db
    image: pgvector/pgvector:pg15
    user: "999:999"  # Run as postgres user (standard UID/GID)
    networks:
      - oai-network
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_DB: open_agent_inv
      POSTGRES_USER: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    ports:
      - "5432:5432"
    # Increase shared memory for PostgreSQL (fixes "could not resize shared memory segment" errors)
    shm_size: 512mb

  api:
    container_name: oai-api
    build:
      context: ./api
      platforms:
        - "linux/amd64"
    user: "1000:1000"  # Run as oai user
    networks:
      - oai-network
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:example@db/open_agent_inv
      JWT_SECRET: supersecretkey
      LLM_ENDPOINT: http://llm-service:8000/generate
      LOG_LEVEL: INFO
      LOG_FORMAT: "%(asctime)s %(levelname)s %(name)s %(message)s"
      LOG_DATEFMT: "%Y-%m-%d %H:%M:%S"
      LOG_FILE: null
      LOG_JSON: false
    ports:
      - "8000:8000"
    volumes:
      - ./api/data/policies:/app/data/policies:ro
      - ./api/data/agents:/app/data/agents:ro
      - investigations_data:/data/investigations
      # Mount .llm_config.env if it exists (optional - for auto-configuration)
      - ./.llm_config.env:/app/.llm_config.env:ro

  worker:
    container_name: oai-worker
    build:
      context: ./api
      dockerfile: worker/Dockerfile
      platforms:
        - "linux/amd64"
    user: "1000:1000"  # Run as oai user
    networks:
      - oai-network
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:example@db/open_agent_inv
      # Worker concurrency settings
      NUM_WORKERS: ${NUM_WORKERS:-8}  # Number of main worker processes (parsing/agent jobs) - default 8
      LOG_LEVEL: INFO
      LOG_FORMAT: "%(asctime)s %(levelname)s %(name)s %(message)s"
      LOG_DATEFMT: "%Y-%m-%d %H:%M:%S"
      LOG_FILE: null
      LOG_JSON: false
    volumes:
      - ./api/data/policies:/app/data/policies:ro
      - ./api/data/agents:/app/data/agents:ro
      - investigations_data:/data/investigations  # Read-write mount (needed for archive extraction)
      - /tmp:/tmp  # Writable temp space
    restart: unless-stopped

  embedding-worker:
    container_name: oai-embedding-worker
    build:
      context: ./api
      dockerfile: worker/Dockerfile
      platforms:
        - "linux/amd64"
    command: python -m worker.embedding_background_worker
    user: "1000:1000"  # Run as oai user
    networks:
      - oai-network
    depends_on:
      init:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:example@db/open_agent_inv
      # Embedding worker concurrency settings
      NUM_EMBEDDING_WORKERS: ${NUM_EMBEDDING_WORKERS:-4}  # Number of embedding worker processes - default 4
      MAX_CONCURRENT_EMBEDDING_BATCHES: ${MAX_CONCURRENT_EMBEDDING_BATCHES:-16}  # Concurrent API calls per job - default 16
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-100}  # Events per API call - default 100
      LOG_LEVEL: INFO
      LOG_FORMAT: "%(asctime)s %(levelname)s %(name)s %(message)s"
      LOG_DATEFMT: "%Y-%m-%d %H:%M:%S"
      LOG_FILE: null
      LOG_JSON: false
    restart: unless-stopped

  ui:
    container_name: oai-ui
    build:
      context: ./ui
      platforms:
        - "linux/amd64"
    user: "101:101"  # Run as nginx user (nginx-unprivileged default UID/GID)
    networks:
      - oai-network
    ports:
      - "443:8443"  # Map host port 443 to container port 8443 (unprivileged)
    depends_on:
      init:
        condition: service_completed_successfully
      api:
        condition: service_started
    volumes:
      - ./certs:/certs:ro  # Read-only mount of SSL certificates

volumes:
  pg_data:
    name: oai-pg-data
  investigations_data:
    name: oai-investigations-data
