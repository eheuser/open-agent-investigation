name: Tests

on:
  # push:
  #   branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd api
          pip install -r requirements.txt
          pip install -r tests/requirements-test.txt
      
      - name: Run unit tests
        run: |
          cd api
          pytest tests/ -v -m unit \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --junit-xml=junit.xml
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./api/coverage.xml
          flags: unit
          name: unit-tests
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: api/junit.xml

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: open_agent_inv_test
          POSTGRES_USER: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          cd api
          pip install -r requirements.txt
          pip install -r tests/requirements-test.txt
      
      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:testpass@localhost:5432/open_agent_inv_test
          DATABASE_URL: postgresql+asyncpg://postgres:testpass@localhost:5432/open_agent_inv_test
          JWT_SECRET: test-secret-key
        run: |
          cd api
          pytest tests/ -v -m integration \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --junit-xml=junit.xml
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./api/coverage.xml
          flags: integration
          name: integration-tests
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: api/junit.xml

  docker-tests:
    name: Docker Integration Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Run tests in Docker
        run: |
          docker-compose -f docker-compose.test.yml up \
            --abort-on-container-exit \
            --exit-code-from test-runner
      
      - name: Copy test results
        if: always()
        run: |
          docker-compose -f docker-compose.test.yml run --rm test-runner \
            sh -c "cp -r /test-results/* /test-results/ && cp -r /htmlcov/* /htmlcov/"
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-coverage-report
          path: htmlcov/
      
      - name: Cleanup
        if: always()
        run: docker-compose -f docker-compose.test.yml down -v

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install ruff mypy black isort
          cd api
          pip install -r requirements.txt
      
      - name: Run ruff (linter)
        run: |
          cd api
          ruff check app/ tests/
      
      - name: Run black (formatter check)
        run: |
          cd api
          black --check app/ tests/
      
      - name: Run isort (import sorting check)
        run: |
          cd api
          isort --check-only app/ tests/
      
      - name: Run mypy (type checking)
        run: |
          cd api
          mypy app/ --ignore-missing-imports
        continue-on-error: true  # Don't fail on type errors yet

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download unit test coverage
        uses: actions/download-artifact@v4
        with:
          name: unit-test-results
          path: unit-results/
      
      - name: Download integration test coverage
        uses: actions/download-artifact@v4
        with:
          name: integration-test-results
          path: integration-results/
      
      - name: Generate coverage badge
        uses: cicirello/jacoco-badge-generator@v2
        with:
          badges-directory: badges
          generate-summary: true
      
      - name: Upload coverage badge
        uses: actions/upload-artifact@v4
        with:
          name: coverage-badge
          path: badges/
